<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="256" height="256" shape-rendering="crispEdges">
<!--
  PIXEL — 16x16 tamagotchi sprite
  K = #1a1210  (near-black: outline, eyes, mouth)
  W = #e8dcc8  (warm parchment: d20 face)
  T = #0d5f6f  (dark teal: cuttlefish body)
  C = #3cc8d8  (bright cyan: bioluminescent dots)

  Row layout:
  r0      top edge of d20 (6px wide, cols 5-10)
  r1-r2   d20 widens (8px, 10px)
  r3-r11  d20 full width (12px), teal body inside
  r4-r5   eyes (2x2 solid black at cols 5-6 and 9-10)
  r7      smirk (2px dash at cols 6-7, slight left offset)
  r8      two bio-glow dots (cols 6 and 9)
  r11-r12 d20 narrows back
  r13     bottom edge (6px)
  r14-r15 three tentacle nubs (cols 5, 7, 9)
-->

  <!-- r0: top edge -->
  <rect x="5" y="0" width="6" height="1" fill="#1a1210"/>

  <!-- r1 -->
  <rect x="3" y="1" width="1" height="1" fill="#1a1210"/>
  <rect x="4" y="1" width="8" height="1" fill="#e8dcc8"/>
  <rect x="12" y="1" width="1" height="1" fill="#1a1210"/>

  <!-- r2 -->
  <rect x="2" y="2" width="1" height="1" fill="#1a1210"/>
  <rect x="3" y="2" width="10" height="1" fill="#e8dcc8"/>
  <rect x="13" y="2" width="1" height="1" fill="#1a1210"/>

  <!-- r3: teal body enters -->
  <rect x="2" y="3" width="1" height="1" fill="#1a1210"/>
  <rect x="3" y="3" width="1" height="1" fill="#e8dcc8"/>
  <rect x="4" y="3" width="8" height="1" fill="#0d5f6f"/>
  <rect x="12" y="3" width="1" height="1" fill="#e8dcc8"/>
  <rect x="13" y="3" width="1" height="1" fill="#1a1210"/>

  <!-- r4: eyes top (2x2 solid black at 5-6 and 9-10) -->
  <rect x="2" y="4" width="1" height="1" fill="#1a1210"/>
  <rect x="3" y="4" width="1" height="1" fill="#e8dcc8"/>
  <rect x="4" y="4" width="1" height="1" fill="#0d5f6f"/>
  <rect x="5" y="4" width="2" height="1" fill="#1a1210"/>
  <rect x="7" y="4" width="2" height="1" fill="#0d5f6f"/>
  <rect x="9" y="4" width="2" height="1" fill="#1a1210"/>
  <rect x="11" y="4" width="1" height="1" fill="#0d5f6f"/>
  <rect x="12" y="4" width="1" height="1" fill="#e8dcc8"/>
  <rect x="13" y="4" width="1" height="1" fill="#1a1210"/>

  <!-- r5: eyes bottom (same as r4 eye positions) -->
  <rect x="2" y="5" width="1" height="1" fill="#1a1210"/>
  <rect x="3" y="5" width="1" height="1" fill="#e8dcc8"/>
  <rect x="4" y="5" width="1" height="1" fill="#0d5f6f"/>
  <rect x="5" y="5" width="2" height="1" fill="#1a1210"/>
  <rect x="7" y="5" width="2" height="1" fill="#0d5f6f"/>
  <rect x="9" y="5" width="2" height="1" fill="#1a1210"/>
  <rect x="11" y="5" width="1" height="1" fill="#0d5f6f"/>
  <rect x="12" y="5" width="1" height="1" fill="#e8dcc8"/>
  <rect x="13" y="5" width="1" height="1" fill="#1a1210"/>

  <!-- r6: plain body -->
  <rect x="2" y="6" width="1" height="1" fill="#1a1210"/>
  <rect x="3" y="6" width="1" height="1" fill="#e8dcc8"/>
  <rect x="4" y="6" width="8" height="1" fill="#0d5f6f"/>
  <rect x="12" y="6" width="1" height="1" fill="#e8dcc8"/>
  <rect x="13" y="6" width="1" height="1" fill="#1a1210"/>

  <!-- r7: smirk (2px slightly left of center at cols 6-7) -->
  <rect x="2" y="7" width="1" height="1" fill="#1a1210"/>
  <rect x="3" y="7" width="1" height="1" fill="#e8dcc8"/>
  <rect x="4" y="7" width="2" height="1" fill="#0d5f6f"/>
  <rect x="6" y="7" width="2" height="1" fill="#1a1210"/>
  <rect x="8" y="7" width="4" height="1" fill="#0d5f6f"/>
  <rect x="12" y="7" width="1" height="1" fill="#e8dcc8"/>
  <rect x="13" y="7" width="1" height="1" fill="#1a1210"/>

  <!-- r8: two bioluminescent dots -->
  <rect x="2" y="8" width="1" height="1" fill="#1a1210"/>
  <rect x="3" y="8" width="1" height="1" fill="#e8dcc8"/>
  <rect x="4" y="8" width="2" height="1" fill="#0d5f6f"/>
  <rect x="6" y="8" width="1" height="1" fill="#3cc8d8"/>
  <rect x="7" y="8" width="2" height="1" fill="#0d5f6f"/>
  <rect x="9" y="8" width="1" height="1" fill="#3cc8d8"/>
  <rect x="10" y="8" width="2" height="1" fill="#0d5f6f"/>
  <rect x="12" y="8" width="1" height="1" fill="#e8dcc8"/>
  <rect x="13" y="8" width="1" height="1" fill="#1a1210"/>

  <!-- r9: plain body -->
  <rect x="2" y="9" width="1" height="1" fill="#1a1210"/>
  <rect x="3" y="9" width="1" height="1" fill="#e8dcc8"/>
  <rect x="4" y="9" width="8" height="1" fill="#0d5f6f"/>
  <rect x="12" y="9" width="1" height="1" fill="#e8dcc8"/>
  <rect x="13" y="9" width="1" height="1" fill="#1a1210"/>

  <!-- r10: body narrows at bottom -->
  <rect x="2" y="10" width="1" height="1" fill="#1a1210"/>
  <rect x="3" y="10" width="2" height="1" fill="#e8dcc8"/>
  <rect x="5" y="10" width="6" height="1" fill="#0d5f6f"/>
  <rect x="11" y="10" width="2" height="1" fill="#e8dcc8"/>
  <rect x="13" y="10" width="1" height="1" fill="#1a1210"/>

  <!-- r11 -->
  <rect x="2" y="11" width="1" height="1" fill="#1a1210"/>
  <rect x="3" y="11" width="10" height="1" fill="#e8dcc8"/>
  <rect x="13" y="11" width="1" height="1" fill="#1a1210"/>

  <!-- r12: d20 narrowing -->
  <rect x="3" y="12" width="1" height="1" fill="#1a1210"/>
  <rect x="4" y="12" width="8" height="1" fill="#e8dcc8"/>
  <rect x="12" y="12" width="1" height="1" fill="#1a1210"/>

  <!-- r13: bottom edge of d20 -->
  <rect x="5" y="13" width="6" height="1" fill="#1a1210"/>

  <!-- r14-r15: three tentacle nubs -->
  <rect x="5" y="14" width="1" height="2" fill="#0d5f6f"/>
  <rect x="7" y="14" width="1" height="2" fill="#0d5f6f"/>
  <rect x="9" y="14" width="1" height="2" fill="#0d5f6f"/>

</svg>
